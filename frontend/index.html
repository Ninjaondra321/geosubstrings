<!DOCTYPE html>
<html lang="cs">

<head>
    <meta charset="UTF-8">
    <title>3D Mapa populace Evropy</title>

    <script src="https://unpkg.com/deck.gl@latest/dist.min.js"></script>
    <script src="https://unpkg.com/maplibre-gl@3.x/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@3.x/dist/maplibre-gl.css" rel="stylesheet" />

    <style>
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: sans-serif;
        }

        #container {
            width: 100%;
            height: 100%;
        }

        /* Top-left search bar */
        #search-container {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 15px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            gap: 10px;
            color: #fff;
        }

        /* Search input wrapper for VS Code style regex toggle */
        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        #search-input {
            padding: 8px 36px 8px 12px;
            /* Extra right padding for regex button */
            border-radius: 4px;
            border: 1px solid #555;
            background: #222;
            color: #fff;
            font-size: 14px;
            outline: none;
        }

        #search-input:focus {
            border-color: #007acc;
        }

        /* VS Code Style Regex Toggle Button */
        #regex-btn {
            position: absolute;
            right: 4px;
            background: transparent;
            border: 1px solid transparent;
            border-radius: 3px;
            color: #888;
            font-family: monospace;
            font-weight: bold;
            font-size: 12px;
            padding: 2px 5px;
            cursor: pointer;
            user-select: none;
            transition: all 0.15s ease;
        }

        #regex-btn:hover {
            color: #ccc;
            background: rgba(255, 255, 255, 0.1);
        }

        #regex-btn.active {
            color: #fff;
            background: #007acc;
            border-color: #007acc;
        }

        /* Bottom-left dataset selector */
        #dataset-container {
            position: absolute;
            bottom: 20px;
            left: 20px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 15px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            gap: 10px;
            color: #fff;
        }

        #dataset-select {
            padding: 8px 12px;
            border-radius: 4px;
            border: 1px solid #555;
            background: #222;
            color: #fff;
            font-size: 14px;
            outline: none;
            cursor: pointer;
        }

        #dataset-select:focus {
            border-color: #007acc;
        }

        /* Top-right info button */
        #info-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 10;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            transition: background 0.2s;
        }

        #info-btn:hover {
            background: rgba(40, 40, 40, 0.9);
        }

        /* Modal Dialog */
        #info-modal {
            display: flex;
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.6);
            z-index: 100;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: #1e1e1e;
            color: #fff;
            padding: 24px;
            border-radius: 10px;
            width: 340px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        .modal-content h3 {
            margin-top: 0;
            color: #007acc;
        }

        .modal-content p {
            font-size: 14px;
            line-height: 1.5;
            color: #ccc;
        }

        .close-btn {
            position: absolute;
            top: 12px;
            right: 16px;
            background: none;
            border: none;
            color: #aaa;
            font-size: 20px;
            cursor: pointer;
        }

        .close-btn:hover {
            color: #fff;
        }
    </style>
</head>

<body>
    <!-- Search Bar (Top Left) -->
    <div id="search-container">
        <label for="search-input">Hledaný podřetězec:</label>
        <div class="input-wrapper">
            <input type="text" id="search-input" value="ovice" placeholder="Napište podřetězec...">
            <button id="regex-btn" title="Použít regulární výraz (Alt+R)">.*</button>
        </div>
        <span id="match-count" style="font-size: 13px; color: #aaa;"></span>
    </div>

    <!-- Dataset Selector (Bottom Left) -->
    <div id="dataset-container">
        <label for="dataset-select">Dataset:</label>
        <select id="dataset-select">
            <option value="">-- Vyberte dataset --</option>
        </select>
    </div>

    <!-- Info Button (Top Right) -->
    <button id="info-btn" aria-label="Informace">?</button>

    <!-- Info Modal Dialog -->
    <div id="info-modal" style="display: none;">
        <div class="modal-content">
            <h2>GeoSubstrings</h2>
            <button class="close-btn" id="close-modal">&times;</button>

            <p>Tato 3D vizualizace zobrazuje četnost výskytu zadatelných podřetězců v názvech měst na mapě pomocí
                Deck.GL sloupce.</p>
            <p><strong>Autor:</strong> <a href="https://notime.cz/">NoTime</a></p>
            <p><strong>Source code:</strong> <a href="https://github.com/Ninjaondra321/geosubstrings">GitHub</a></p>
        </div>
    </div>

    <div id="container"></div>

    <script>
        async function fetchDatasetList() {
            try {
                const response = await fetch('datasets.json');
                if (!response.ok) throw new Error(`HTTP error! Status: ${response.status}`);
                return await response.json();
            } catch (error) {
                console.error('Error loading datasets.json:', error);
                return [];
            }
        }

        async function loadCities(path) {
            if (!path) return [];
            try {
                const response = await fetch(path);
                if (!response.ok) throw new Error(`HTTP error! Status: ${response.status}`);
                return await response.json();
            } catch (error) {
                console.error(`Error loading dataset (${path}):`, error);
                return [];
            }
        }

        async function main() {
            let rawCities = [];
            const datasetSelect = document.getElementById('dataset-select');
            const searchInput = document.getElementById('search-input');
            const regexBtn = document.getElementById('regex-btn');
            const countDisplay = document.getElementById('match-count');

            let isRegexEnabled = false;

            // Set initial focus
            searchInput.focus();

            // Refocus searchInput when focus leaves, UNLESS user clicked an interactive control
            searchInput.addEventListener('blur', () => {
                setTimeout(() => {
                    const active = document.activeElement;
                    const isInteractive = active.tagName === 'SELECT' ||
                        active.tagName === 'INPUT' ||
                        active.tagName === 'BUTTON' ||
                        active.tagName === 'A';

                    if (!isInteractive) {
                        searchInput.focus();
                    }
                }, 0);
            });

            // Dragging or clicking the map specifically keeps focus on the input
            document.getElementById('container').addEventListener('mousedown', (e) => {
                e.preventDefault();
                searchInput.focus();
            });

            // Parse URL search parameters on init
            const urlParams = new URLSearchParams(window.location.search);
            const initialQuery = urlParams.get('q');
            const initialDataset = urlParams.get('dataset');
            const initialRegex = urlParams.get('regex');

            if (initialQuery !== null) {
                searchInput.value = initialQuery;
            }

            if (initialRegex === 'true') {
                isRegexEnabled = true;
                regexBtn.classList.add('active');
            }

            // Function to synchronize current input & select state back to URL parameters
            function updateURLParams() {
                const params = new URLSearchParams(window.location.search);

                if (searchInput.value) {
                    params.set('q', searchInput.value);
                } else {
                    params.delete('q');
                }

                if (datasetSelect.value) {
                    params.set('dataset', datasetSelect.value);
                } else {
                    params.delete('dataset');
                }

                if (isRegexEnabled) {
                    params.set('regex', 'true');
                } else {
                    params.delete('regex');
                }

                const newRelativePathQuery = window.location.pathname + (params.toString() ? '?' + params.toString() : '');
                history.replaceState(null, '', newRelativePathQuery);
            }

            // Populate dataset dropdown options (storing clean filename without 'datasets/' prefix)
            const datasets = await fetchDatasetList();
            datasets.forEach(item => {
                const option = document.createElement('option');
                const cleanName = item.path.replace('datasets/', '');
                option.value = cleanName;
                option.textContent = `${cleanName} (${item.items} položek)`;
                datasetSelect.appendChild(option);
            });

            // Select dataset from URL param if available, or default to first dataset
            if (initialDataset) {
                const cleanInitial = initialDataset.replace('datasets/', '');
                if (datasets.some(d => d.path.replace('datasets/', '') === cleanInitial)) {
                    datasetSelect.value = cleanInitial;
                }
            } else if (datasets.length > 0) {
                datasetSelect.value = datasets[0].path.replace('datasets/', '');
            }

            // Load initial dataset cities
            if (datasetSelect.value) {
                rawCities = await loadCities(`datasets/${datasetSelect.value}`);
            }

            // Sync URL parameters on initial load
            updateURLParams();

            function getMatchCount(text, pattern, isRegex) {
                if (!pattern) return 0;

                if (isRegex) {
                    try {
                        const regex = new RegExp(pattern, 'gi');
                        const matches = text.match(regex);
                        return matches ? matches.length : 0;
                    } catch (e) {
                        // Invalid Regex expression being typed
                        return 0;
                    }
                } else {
                    return text.toLowerCase().split(pattern.toLowerCase()).length - 1;
                }
            }

            function createLayer(query, isRegex) {
                let matchedCitiesCount = 0;
                const totalCitiesCount = rawCities.length;

                // Validate regex if regex mode is active
                let isInvalidRegex = false;
                if (isRegex && query) {
                    try {
                        new RegExp(query, 'gi');
                    } catch (e) {
                        isInvalidRegex = true;
                    }
                }

                const data = rawCities.map(a => {
                    const count = getMatchCount(a[0], query, isRegex);
                    if (count > 0) matchedCitiesCount++;

                    return {
                        name: a[0],
                        coordinates: [a[2], a[1]],
                        population: count
                    };
                });

                if (countDisplay) {
                    if (isInvalidRegex) {
                        countDisplay.textContent = 'Neplatný Regex';
                        countDisplay.style.color = '#ff6b6b';
                    } else {
                        countDisplay.style.color = '#aaa';
                        countDisplay.textContent = query && totalCitiesCount > 0
                            ? `Matched ${matchedCitiesCount}/${totalCitiesCount}`
                            : `Matched 0/${totalCitiesCount}`;
                    }
                }

                return new deck.ColumnLayer({
                    id: 'population-columns',
                    data: data,
                    getPosition: d => d.coordinates,
                    getElevation: d => d.population,
                    elevationScale: 10000,
                    radius: 2000,
                    getFillColor: d => [
                        Math.min(255, d.population * 200),
                        100,
                        Math.max(50, 255 - d.population / 10000),
                        200
                    ],
                    pickable: true,
                    extruded: true,
                    material: {
                        ambient: 0.35,
                        diffuse: 0.6,
                        shininess: 32
                    }
                });
            }

            const deckgl = new deck.DeckGL({
                container: 'container',
                mapStyle: 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json',
                initialViewState: {
                    longitude: 15.4378,
                    latitude: 49.8,
                    zoom: 5,
                    pitch: 50,
                    bearing: 0
                },
                controller: true,
                layers: [createLayer(searchInput.value, isRegexEnabled)],
                getTooltip: ({ object }) => object ? `${object.name}\nVýskyty: ${object.population}` : null
            });

            function updateMap() {
                deckgl.setProps({
                    layers: [createLayer(searchInput.value, isRegexEnabled)]
                });
            }

            // Regex toggle handler
            function toggleRegex() {
                isRegexEnabled = !isRegexEnabled;
                regexBtn.classList.toggle('active', isRegexEnabled);
                updateURLParams();
                updateMap();
            }

            regexBtn.addEventListener('click', toggleRegex);

            // Alt+R shortcut (VS Code default for regex toggle)
            document.addEventListener('keydown', (e) => {
                if (e.altKey && (e.key === 'r' || e.key === 'R')) {
                    e.preventDefault();
                    toggleRegex();
                }
            });

            datasetSelect.addEventListener('change', async (e) => {
                const selectedFilename = e.target.value;
                rawCities = await loadCities(selectedFilename ? `datasets/${selectedFilename}` : '');
                updateURLParams();
                updateMap();
            });

            let debounceTimer;

            searchInput.addEventListener('input', () => {
                clearTimeout(debounceTimer);
                debounceTimer = setTimeout(() => {
                    updateURLParams();
                    updateMap();
                }, 100);
            });

            const infoBtn = document.getElementById('info-btn');
            const infoModal = document.getElementById('info-modal');
            const closeModal = document.getElementById('close-modal');

            infoBtn.addEventListener('click', () => {
                infoModal.style.display = 'flex';
            });

            closeModal.addEventListener('click', () => {
                infoModal.style.display = 'none';
            });

            window.addEventListener('click', (e) => {
                if (e.target === infoModal) {
                    infoModal.style.display = 'none';
                }
            });
        }

        main();
    </script>
</body>

</html>
